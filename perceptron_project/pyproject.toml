[project]
name = "perceptron-project"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "scikit-learn>=1.9.1",
]

[project.scripts]
perceptron = "perceptron.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true
